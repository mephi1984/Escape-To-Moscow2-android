plugins {
    id "com.android.application"
}


def localPropertiesFile = rootProject.file("bundle.properties")


def localProperties = new Properties()
localProperties.load(new FileInputStream(localPropertiesFile))

android {
    compileSdkVersion = "android-37"

    namespace = "fishrungames.escapetomoscow2"

    defaultConfig {
        applicationId = "fishrungames.escapetomoscow2"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode = 1760864732
        versionName = "1.2.1"
    }

    signingConfigs {
        release {
            storeFile = file(localProperties["key.store"])
            storePassword = localProperties["key.store.password"]
            keyAlias = localProperties["key.alias"]
            keyPassword = localProperties["key.alias.password"]
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }

        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            packaging {
                jniLibs {
                    useLegacyPackaging = true
                    keepDebugSymbols = [ "**/*.so" ]
                }
            }
        }

        release {
            signingConfig =signingConfigs.release
            minifyEnabled = false
            packaging {
                jniLibs {
                    useLegacyPackaging = true
                    keepDebugSymbols = [ "**/*.so" ]
                }
            }
        }
    }


    assetPacks = [ ":ff1", ":ff2", ":ff3", ":ff4" ]


    androidResources {
        noCompress = [ "ogv", "avi", "mpg", "webm", "mkv", "mp4", "mp3", "mp2", "ogg", "opus", "flac", "png", "jpg", "jpeg", "webp", "avif", "rpyc", "rpymc", "rpyb", ]
    }
}

dependencies {
    implementation project(":renpyandroid")

}